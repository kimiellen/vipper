<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vipper 访问请求</title>
<style>
/* ==== @tokens:start 由 design-system/tokens.css 同步生成，请勿手改 ====
/* ==========================================================================
   设计 Token —— 所有页面的唯一样式来源
   --------------------------------------------------------------------------
   【当前风格】已定稿 v1（2026-10-11 与用户逐项确认）
     · 整体氛围：深色科技感（GitHub Dark / 终端风）
     · 配色方案：Catppuccin 家族 —— dark = Mocha（默认），light = Latte
     · 主色：Mauve 紫
     · 圆角：小圆角（4-6px）
     · 密度：标准（正文 14px）
     · 字体：中文 Alibaba PuHuiTi 3.0，英文/符号 CodeNewRoman Nerd Font Mono
     · 布局：wui 侧边栏布局为主，内容区最大宽度 1200px
   【双主题】默认 dark（Mocha）；<html data-theme="light"> 启用 light（Latte）。
     两套主题变量名完全一致，页面无需任何改动即可切换。
   【同步机制】页面/模板 html 不引用本文件，而是在 <style> 内联完整 token
     块（@tokens 标记之间，由 scripts/sync-tokens.py 生成）。修改本文件后运行：
       python3 scripts/sync-tokens.py
     自动同步所有模板与 pages/ 下的页面。禁止手改 html 里的 token 块。
   修改规则：组件样式只允许引用本文件的变量，禁止硬编码色值/字号/间距。
   ========================================================================== */

/* ===== 主题：dark（Catppuccin Mocha，默认） ===== */

:root {
  /* ---- 主色（accent）：Catppuccin Mocha Mauve ---- */
  --accent: #cba6f7;                     /* mauve */
  --accent-hover: #d9c2fa;               /* mauve 提亮（派生） */
  --accent-active: #b793f0;              /* mauve 压暗（派生） */
  --accent-fg: #11111b;                  /* 主色上的文字：crust */
  --accent-soft: rgba(203, 166, 247, 0.14);  /* 主色浅底（选中行、tag 底） */

  /* ---- 中性色：Catppuccin Mocha 底色阶梯 ---- */
  --bg: #181825;                         /* mantle：页面底色 */
  --bg-raised: #1e1e2e;                  /* base：卡片、侧边栏 */
  --bg-subtle: #313244;                  /* surface0：表头、hover、输入框 */
  --bg-hover: #45475a;                   /* surface1：强 hover */
  --fg: #cdd6f4;                         /* text：主要文字 */
  --fg-secondary: #bac2de;               /* subtext1：次要文字 */
  --fg-muted: #7f849c;                   /* overlay1：弱化文字（占位、说明） */
  --border: #313244;                     /* surface0：常规边框 */
  --border-strong: #585b70;              /* surface2：强调边框（输入框） */

  /* ---- 语义色（Catppuccin Mocha） ---- */
  --success: #a6e3a1;                    /* green */
  --success-soft: rgba(166, 227, 161, 0.12);
  --warning: #f9e2af;                    /* yellow */
  --warning-soft: rgba(249, 226, 175, 0.12);
  --danger: #f38ba8;                     /* red */
  --danger-hover: #f5a5bc;               /* red 提亮（派生） */
  --danger-fg: #11111b;                  /* 危险按钮上的文字：crust */
  --danger-soft: rgba(243, 139, 168, 0.12);
  --info: #89dceb;                       /* sky */
  --info-soft: rgba(137, 220, 235, 0.12);

  /* ---- 标签彩色：Catppuccin Mocha 14 彩色（tag 颜色选择等场景） ---- */
  --cat-rosewater: #f5e0dc;
  --cat-flamingo: #f2cdcd;
  --cat-pink: #f5c2e7;
  --cat-mauve: #cba6f7;
  --cat-red: #f38ba8;
  --cat-maroon: #eba0ac;
  --cat-peach: #fab387;
  --cat-yellow: #f9e2af;
  --cat-green: #a6e3a1;
  --cat-teal: #94e2d5;
  --cat-sky: #89dceb;
  --cat-sapphire: #74c7ec;
  --cat-blue: #89b4fa;
  --cat-lavender: #b4befe;

  /* ---- 字体 ---- */
  /* 英文/数字/符号优先命中 CodeNewRoman（等宽 + Nerd Font 图标），
     中文回退到阿里巴巴普惠体 3.0，最后是任意系统的通用回退。 */
  --font-family: "CodeNewRoman Nerd Font Mono", "Alibaba PuHuiTi 3.0",
    "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: "CodeNewRoman Nerd Font Mono", ui-monospace, "SF Mono",
    "Cascadia Mono", Consolas, monospace;

  /* ---- 字号（标准密度） ---- */
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;

  /* ---- 字重 ---- */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ---- 间距（4px 基准） ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ---- 圆角（小圆角） ---- */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 6px;
  --radius-full: 9999px;

  /* ---- 阴影（深色主题：压低、偏黑） ---- */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.45);

  /* ---- 布局 ---- */
  --content-max-width: 1200px;
  --sidebar-width: 220px;
  --header-height: 56px;

  /* ---- 过渡 ---- */
  --transition: 150ms ease;
}

/* ===== 主题：light（Catppuccin Latte，Mocha 的同族浅色款） =====
   只覆盖随主题变化的变量（颜色与阴影）；字体/字号/间距/圆角等通用。 */
:root[data-theme="light"] {
  /* ---- 主色：Latte Mauve ---- */
  --accent: #8839ef;                     /* mauve */
  --accent-hover: #7c2fe4;               /* mauve 压暗（派生） */
  --accent-active: #6d28c9;              /* mauve 再压暗（派生） */
  --accent-fg: #eff1f5;                  /* 主色上的文字：base */
  --accent-soft: rgba(136, 57, 239, 0.10);

  /* ---- 中性色：Latte 底色阶梯 ---- */
  --bg: #e6e9ef;                         /* mantle：页面底色 */
  --bg-raised: #eff1f5;                  /* base：卡片、侧边栏 */
  --bg-subtle: #dce0e8;                  /* crust：表头、hover、输入框 */
  --bg-hover: #ccd0da;                   /* surface0：强 hover */
  --fg: #4c4f69;                         /* text：主要文字 */
  --fg-secondary: #5c5f77;               /* subtext1：次要文字 */
  --fg-muted: #8c8fa1;                   /* overlay1：弱化文字 */
  --border: #ccd0da;                     /* surface0：常规边框 */
  --border-strong: #acb0be;              /* surface2：强调边框 */

  /* ---- 语义色（Latte） ---- */
  --success: #40a02b;                    /* green */
  --success-soft: rgba(64, 160, 43, 0.10);
  --warning: #df8e1d;                    /* yellow */
  --warning-soft: rgba(223, 142, 29, 0.12);
  --danger: #d20f39;                     /* red */
  --danger-hover: #b30d31;               /* red 压暗（派生） */
  --danger-fg: #eff1f5;
  --danger-soft: rgba(210, 15, 57, 0.08);
  --info: #04a5e5;                       /* sky */
  --info-soft: rgba(4, 165, 229, 0.10);

  /* ---- 标签彩色：Catppuccin Latte 14 彩色 ---- */
  --cat-rosewater: #dc8a78;
  --cat-flamingo: #dd7878;
  --cat-pink: #ea76cb;
  --cat-mauve: #8839ef;
  --cat-red: #d20f39;
  --cat-maroon: #e64553;
  --cat-peach: #fe640b;
  --cat-yellow: #df8e1d;
  --cat-green: #40a02b;
  --cat-teal: #179299;
  --cat-sky: #04a5e5;
  --cat-sapphire: #209fb5;
  --cat-blue: #1e66f5;
  --cat-lavender: #7287fd;

  /* ---- 阴影（浅色主题：轻、偏冷灰） ---- */
  --shadow-sm: 0 1px 2px rgba(76, 79, 105, 0.08);
  --shadow-md: 0 2px 8px rgba(76, 79, 105, 0.10);
  --shadow-lg: 0 8px 24px rgba(76, 79, 105, 0.14);
}
/* ==== @tokens:end ==== */
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--space-4);
    font-family: var(--font-family); font-size: var(--text-base);
    color: var(--fg); background: var(--bg); line-height: 1.6;
  }
  .mono { font-family: var(--font-mono); }
  [hidden] { display: none !important; }

  h1 { margin: 0 0 var(--space-2); font-size: var(--text-lg); font-weight: var(--weight-semibold); }
  .lead { margin: 0 0 var(--space-3); color: var(--fg-secondary); }
  .lead strong { color: var(--fg); }

  .meta {
    margin: 0 0 var(--space-3); padding: var(--space-3);
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .meta > div { display: flex; gap: var(--space-3); padding: 2px 0; }
  .meta dt { flex: 0 0 4em; color: var(--fg-muted); }
  .meta dd { margin: 0; word-break: break-all; }

  .hint { margin: 0 0 var(--space-3); font-size: var(--text-sm); color: var(--fg-muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1);
    padding: var(--space-2) var(--space-3);
    font: inherit; font-weight: var(--weight-medium); line-height: 1.5;
    border: 1px solid transparent; border-radius: var(--radius-md);
    cursor: pointer; transition: all var(--transition); white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--fg-secondary); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--bg-subtle); color: var(--fg); }

  .actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  .countdown { margin: var(--space-2) 0 0; text-align: right; font-size: var(--text-sm); color: var(--fg-muted); }

  #expired { text-align: center; padding: var(--space-4) 0; color: var(--fg-secondary); }
</style>
</head>
<body>
<main id="panel">
  <h1>vipper 配对请求</h1>
  <p class="lead">应用 <strong id="f-name-lead">…</strong> 请求访问保管库，是否允许？</p>
  <dl class="meta">
    <div><dt>名称</dt><dd id="f-name">…</dd></div>
    <div><dt>版本</dt><dd id="f-version">…</dd></div>
    <div><dt>路径</dt><dd id="f-exe" class="mono">…</dd></div>
    <div><dt>PID</dt><dd id="f-pid" class="mono">…</dd></div>
    <div><dt>指纹</dt><dd id="f-fp" class="mono">…</dd></div>
  </dl>
  <p class="hint">允许后该客户端的后续请求经加密通道传输，且每次读取私密记录仍按条目策略另行授权。仅允许你主动发起的应用。</p>
  <div class="actions">
    <button id="btn-deny" class="btn btn-ghost" type="button">拒绝</button>
    <button id="btn-allow" class="btn btn-primary" type="button">允许配对</button>
  </div>
  <p class="countdown" id="countdown"></p>
</main>
<main id="panel-authz" hidden>
  <h1>vipper 访问请求</h1>
  <p class="lead">应用 <strong id="a-name-lead">…</strong> 请求读取私密记录，是否允许？</p>
  <dl class="meta">
    <div><dt>条目</dt><dd id="a-path" class="mono">…</dd></div>
    <div><dt>名称</dt><dd id="a-name">…</dd></div>
    <div><dt>路径</dt><dd id="a-exe" class="mono">…</dd></div>
    <div><dt>PID</dt><dd id="a-pid" class="mono">…</dd></div>
    <div><dt>指纹</dt><dd id="a-fp" class="mono">…</dd></div>
  </dl>
  <p class="hint">「仅此一次」签发限时令牌（TTL 内同一条目免再问）；「记住此客户端」把该条目转为 ✅ 永久允许此客户端。仅允许你主动发起的读取。</p>
  <div class="actions">
    <button id="a-btn-deny" class="btn btn-ghost" type="button">拒绝</button>
    <button id="a-btn-once" class="btn btn-ghost" type="button">仅此一次</button>
    <button id="a-btn-remember" class="btn btn-primary" type="button">记住此客户端</button>
  </div>
  <p class="countdown" id="a-countdown"></p>
</main>
<div id="expired" hidden>
  <p id="expired-reason">该请求已失效。</p>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
