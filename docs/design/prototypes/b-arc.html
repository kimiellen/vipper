<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>原型 B · Arc 风</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .panel {
    width: 640px; height: 480px; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #2b2140 0%, #1f1b2e 60%, #1c1a28 100%);
    color: #efeaf7; padding: 18px;
  }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.09); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .search input {
    flex: 1; background: none; border: none; outline: none;
    color: inherit; font-size: 16px;
  }
  .grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; align-content: start; overflow: hidden;
  }
  .card {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.055); border-radius: 14px;
    padding: 13px 14px; border: 1px solid transparent;
  }
  .card.selected {
    background: rgba(255,255,255,.12);
    border-color: rgba(196,167,255,.55);
    box-shadow: 0 0 0 1px rgba(196,167,255,.55), 0 6px 18px rgba(0,0,0,.3);
  }
  .favicon {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
  }
  .title { font-weight: 600; font-size: 14.5px; }
  .sub { color: #a99fc0; font-size: 12px; }
  .footer {
    display: flex; gap: 14px; padding-top: 12px;
    font-size: 11.5px; color: #978baf;
  }
  .footer b { color: #cfc3e3; }
</style>
</head>
<body>
<div class="panel">
  <div class="search">
    <span>🔍</span>
    <input value="git" placeholder="搜索书签…" />
  </div>
  <div class="grid">
    <div class="card selected">
      <span class="favicon" style="background:#24292f">G</span>
      <div><div class="title">GitHub</div><div class="sub">github.com/login</div></div>
    </div>
    <div class="card">
      <span class="favicon" style="background:#e24329">G</span>
      <div><div class="title">GitLab</div><div class="sub">2 个 URL ›</div></div>
    </div>
    <div class="card">
      <span class="favicon" style="background:#c71d23">码</span>
      <div><div class="title">Gitee 码云</div><div class="sub">gitee.com/login</div></div>
    </div>
    <div class="card">
      <span class="favicon" style="background:#3884ff">B</span>
      <div><div class="title">GitBook</div><div class="sub">app.gitbook.com</div></div>
    </div>
  </div>
  <div class="footer">
    <span><b>↵</b> 打开</span><span><b>⌃E</b> 编辑</span><span><b>⌃N</b> 新建</span><span><b>⌃M</b> 管理表</span>
  </div>
</div>
</body>
</html>
