<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>原型 C · 深色极简打磨</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 system-ui, sans-serif; }
  .panel {
    width: 640px; height: 480px; display: flex; flex-direction: column;
    background: #1e1e2e; color: #cdd6f4;
  }
  .search { padding: 14px 14px 10px; }
  .search input {
    width: 100%; padding: 11px 14px; font-size: 16px;
    background: #313244; color: inherit;
    border: 2px solid #89b4fa; border-radius: 10px; outline: none;
    box-shadow: 0 0 0 3px rgba(137,180,250,.15);
  }
  .list { flex: 1; overflow: hidden; padding: 2px 10px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; position: relative;
  }
  .row.selected { background: #313244; }
  .row.selected::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; border-radius: 2px; background: #89b4fa;
  }
  .favicon {
    width: 18px; height: 18px; border-radius: 5px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .hint { margin-left: auto; color: #7f849c; font-size: 12px; }
  .footer {
    padding: 8px 16px; color: #7f849c; font-size: 12px;
    border-top: 1px solid #313244;
    display: flex; gap: 14px;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="search"><input value="git" /></div>
  <div class="list">
    <div class="row selected">
      <span class="favicon" style="background:#24292f">G</span>
      <span>GitHub</span><span class="hint">github.com/login</span>
    </div>
    <div class="row">
      <span class="favicon" style="background:#e24329">G</span>
      <span>GitLab</span><span class="hint">2 个 URL ›</span>
    </div>
    <div class="row">
      <span class="favicon" style="background:#c71d23">码</span>
      <span>Gitee 码云</span><span class="hint">gitee.com/login</span>
    </div>
    <div class="row">
      <span class="favicon" style="background:#3884ff">B</span>
      <span>GitBook</span><span class="hint">app.gitbook.com</span>
    </div>
  </div>
  <div class="footer">
    <span>Enter 打开</span><span>Ctrl+E 编辑</span><span>Ctrl+N 新建</span><span>Ctrl+M 管理表</span><span>Esc 关闭</span>
  </div>
</div>
</body>
</html>
