<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="vipper">
  <title>vipper</title>
  <desc>Bookmark ribbon with a keyhole punched out of it — saved pages, kept private.</desc>
  <!--
    Construction, on a 96 × 96 grid:
      · ribbon 68 × 80, top corners eased 2, sharp V notch at the bottom
        (bookmark tail = saved pages, the notch reads as the "V" of vipper)
      · keyhole: circle r 11 at (48, 31) opening into a slot that flares
        from 7.2 to 13 wide, ending at y 57 — one closed subpath.
    fill-rule="evenodd" subtracts the keyhole subpath from the ribbon.
  -->
  <path fill="#cba6f7" fill-rule="evenodd" d="
    M16 8
    H80 A2 2 0 0 1 82 10
    V88
    L48 64
    L14 88
    V10 A2 2 0 0 1 16 8
    Z
    M44.4 41.39 A11 11 0 1 1 51.6 41.39 L54.5 57 H41.5 Z" />
</svg>
